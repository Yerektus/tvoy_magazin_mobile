org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kotlin компилирует отдельный Kotlin Gradle Plugin, а не сам AGP.
#
# На это Flutter ругается предупреждением про `mobile_scanner`: тот применяет
# KGP, а будущие версии Flutter такую сборку не соберут. Сам сканер тут ни при
# чём — он применяет KGP ровно тогда, когда встроенный Kotlin выключен, то есть
# из-за этой строки.
#
# Включить встроенный Kotlin пока нельзя: `camera_android_camerax` (0.7.4+6,
# последняя на 26.08.2026) тянет KGP через `buildscript` старым способом, и с
# `android.builtInKotlin=true` сборка падает у него же — AGP 9 отказывается
# применять `com.android.library` поверх применённого KGP.
#
# Что делать, когда камеру обновят: поставить здесь `true` и собрать
# `flutter build apk --debug`. Если пройдёт — предупреждение исчезнет.
android.builtInKotlin=false
